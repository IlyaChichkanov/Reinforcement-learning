<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нейросеть вместо таблицы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&family=PT+Mono&display=swap">
<style>
/* Макет: один столбец до 1060px; крупная типографика для проектора. */
:root {
  --bg: #faf8f5;        /* тёплая бумага */
  --surface: #ffffff;
  --fg: #27231d;
  --muted: #776f63;
  --line: #e4ded4;
  --accent: #c44e52;    /* акцент курса */
  --ql: #4C72B0;        /* текущая кривая */
  --sarsa: #DD8452;     /* запасной цвет */
  --good: #2e7d32;
  --good-bg: #e4f2e5;
  --bar: #d8d2c6;
  --cliff: #f3a9a9;
  --goal: #a9dfa9;
  --cell: #ffffff;
  --cell-line: #c9c3b8;
  --start: #eceae5;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1a17; --surface: #262320; --fg: #ece7de; --muted: #a39a8b;
  --line: #3a362f; --accent: #e07478; --ql: #5b8dd6; --sarsa: #d96f38;
  --good: #7fc983; --good-bg: #27402a; --bar: #45413a;
  --cliff: #6e3434; --goal: #2f5d33; --cell: #262320; --cell-line: #4a453d; --start: #343129;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1c1a17; --surface: #262320; --fg: #ece7de; --muted: #a39a8b;
  --line: #3a362f; --accent: #e07478; --ql: #5b8dd6; --sarsa: #d96f38;
  --good: #7fc983; --good-bg: #27402a; --bar: #45413a;
  --cliff: #6e3434; --goal: #2f5d33; --cell: #262320; --cell-line: #4a453d; --start: #343129;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "PT Sans", "Segoe UI", system-ui, sans-serif;
  font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1060px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; padding-block: 22px 6px; }
h1 { font-family: "PT Serif", Georgia, serif; font-size: clamp(24px, 3.4vw, 34px); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 15px; }
nav.tabs { display: flex; gap: 8px; margin: 14px 0 20px; border-bottom: 1px solid var(--line); }
nav.tabs button {
  appearance: none; background: none; border: none; border-bottom: 3px solid transparent;
  font: inherit; font-weight: 700; color: var(--muted); padding: 8px 14px 10px; cursor: pointer;
}
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible
  { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Вопросы ---------- */
.qnav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.qnav button {
  font: inherit; font-weight: 700; border: 1px solid var(--line); background: var(--surface);
  color: var(--muted); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.qnav button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.q-topic { color: var(--muted); font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; }
.q-text { font-family: "PT Serif", Georgia, serif; font-size: clamp(21px, 2.9vw, 32px); line-height: 1.3;
  margin: 6px 0 20px; text-wrap: balance; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; text-align: left;
  font: inherit; font-size: clamp(17px, 2vw, 22px);
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer;
}
.opt .letter {
  flex: none; width: 2em; height: 2em; display: grid; place-items: center;
  border-radius: 50%; background: var(--bar); font-weight: 700; font-size: 0.9em;
}
.opt[data-picked="1"] { border-color: var(--ql); box-shadow: inset 0 0 0 1px var(--ql); }
.opt[data-picked="1"] .letter { background: var(--ql); color: #fff; }
.revealed .opt[data-correct="1"] { border-color: var(--good); background: var(--good-bg); }
.revealed .opt[data-correct="1"] .letter { background: var(--good); color: #fff; }
.verdict { min-height: 1.5em; margin: 14px 0 4px; font-weight: 700; }
.explain { color: var(--muted); max-width: 46em; margin: 0; }
.qactions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.btn {
  font: inherit; font-weight: 700; cursor: pointer;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--fg); padding: 9px 16px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.hint { color: var(--muted); font-size: 15px; }

/* счётчик рук */
details.counter { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 12px; }
details.counter > summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.count-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; margin-top: 14px; }
.count-ctl { display: flex; align-items: center; gap: 6px; }
.count-ctl input {
  width: 4.2em; font: inherit; font-family: "PT Mono", monospace; text-align: center;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px;
}
.count-ctl button { font: inherit; font-weight: 700; width: 2.2em; height: 2.2em; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.bar-row { min-width: 0; display: flex; align-items: center; gap: 10px; }
.bar-track { flex: 1; min-width: 0; height: 26px; border-radius: 4px; background: none; position: relative; }
.bar-fill { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 4px; background: var(--bar);
  transition: width 0.25s; }
.revealed .bar-fill[data-correct="1"] { background: var(--good); }
.bar-num { font-family: "PT Mono", monospace; font-variant-numeric: tabular-nums; min-width: 2.5em; }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Нейросеть вместо таблицы</h1>
  <span class="sub">лекция 6 · курс RL, МИСИС · Q-сеть и буфер опыта</span>
</header>

<!-- ================= ВОПРОСЫ ================= -->
<section id="view-questions">
  <div class="qnav" id="qnav" role="tablist" aria-label="Вопросы"></div>

  <div id="qcard">
    <div class="q-topic" id="q-topic"></div>
    <p class="q-text" id="q-text"></p>
    <div class="opts" id="q-opts"></div>
    <p class="verdict" id="q-verdict"></p>
    <p class="explain" id="q-explain" hidden></p>
    <div class="qactions">
      <button class="btn primary" id="q-reveal">Показать ответ</button>
      <button class="btn" id="q-reset" title="Сбросить мой выбор и счётчик">Сбросить</button>
      <span class="hint">Выберите вариант, проголосуйте в зале — потом открывайте ответ.</span>
    </div>

    <details class="counter" id="q-counter">
      <summary>Счётчик рук (для ведущего)</summary>
      <div class="count-grid" id="count-grid"></div>
    </details>
  </div>
</section>

<footer>
  Страница работает без интернета после загрузки и ничего никуда не отправляет.
  Материалы курса — в <a href="https://github.com/IlyaChichkanov/Reinforcement-learning">репозитории</a>,
  квизы — на <a href="index.html">главной</a>.
</footer>

</div>

<script>
"use strict";
/* ---------------- данные вопросов ---------------- */
const QUESTIONS = [
  {
    "id": "q1",
    "topic": "Разминка · таблица не учит соседей",
    "text": "CartPole: состояние — четыре числа (положение и скорость тележки, угол и угловая скорость шеста). Каждое режем на 6 отрезков: таблица Q на 6 × 6 × 6 × 6 = 1296 клетках, Q-learning 300 эпизодов. Сколько клеток из 1296 получат хотя бы одно обновление?",
    "options": [
      "почти все",
      "около половины",
      "около 10 %",
      "только клетки рядом со стартом"
    ],
    "answer": 2,
    "explain": "На лекции обновления получили 8 % клеток, остальные хранят нули; шест к концу обучения стоит 43–61 шагов. Клетка учится, только когда агент в неё попал: на карте таблицы — острова, а соседняя с самой обновляемой клетка (★ обновлялась 325 раз) не обновлялась ни разу."
  },
  {
    "id": "q2",
    "topic": "Q-сеть · след одного шага",
    "text": "Q-сеть 4 → 64 → 64 → 2 по состоянию даёт Q(s, ←) и Q(s, →). Один шаг градиента сдвинул Q(★, →) в состоянии ★: шест наклонён вправо на 0.05 рад и падает вправо. Где изменится Q(·, →) на плоскости «угол — угловая скорость»?",
    "options": [
      "только в клетке ★, как у таблицы",
      "в небольшом пятне вокруг ★",
      "почти на всей плоскости",
      "нигде заметно: шаг слишком маленький"
    ],
    "answer": 2,
    "explain": "На лекции Q(·, →) сдвинулась на +1.15 в самой ★ и на +0.89 в дальнем углу, где шест падает в другую сторону. У сети все состояния считаются одними и теми же весами — шаг сдвигает оценки всех похожих состояний. Это обобщение."
  },
  {
    "id": "q3",
    "topic": "Буфер опыта",
    "text": "Учим Q-сеть 300 эпизодов двумя способами: шаг градиента на каждом переходе подряд — или на случайных пачках по 64 перехода из журнала всех прошлых переходов (буфер опыта). Цель y = r + γ max Q(s′) считает та же сеть. Оценка старта больше 100 быть не может: 1 + 0.99 + 0.99² + … = 100. Что даст буфер?",
    "options": [
      "шест будет стоять дольше, и оценки Q останутся разумными",
      "шест будет стоять дольше, но оценки Q вырастут до тысяч",
      "ничего не изменится",
      "станет хуже: старые переходы собраны плохой стратегией"
    ],
    "answer": 1,
    "explain": "На лекции с буфером шест стоит 206–348 шагов в эпизодах 100–300 против 52–83 по шагу подряд. Но оценка старта во всех трёх запусках с буфером ушла за предел 100: до 1584, 3698 и 210 279, а по шагу подряд осталась 58–98. Почему так выходит и как это исправить — на следующей лекции."
  }
];
const LETTERS = ["A", "B", "C", "D"];

/* локальное хранение (личное удобство: мой ответ и счётчик) */
const store = {
  get(k, d) { try { const v = localStorage.getItem("l06:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("l06:" + k, JSON.stringify(v)); } catch {} },
};

let qIndex = 0;
let revealed = {};
const $ = (id) => document.getElementById(id);

function renderQnav() {
  const nav = $("qnav");
  nav.innerHTML = "";
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", i === qIndex ? "true" : "false");
    b.setAttribute("aria-label", "Вопрос " + (i + 1));
    b.addEventListener("click", () => { qIndex = i; renderQuestion(); });
    nav.appendChild(b);
  });
}

function counts(q) { return store.get("cnt:" + q.id, [0, 0, 0, 0]); }

function renderQuestion() {
  renderQnav();
  const q = QUESTIONS[qIndex];
  const isRevealed = !!revealed[q.id];
  $("q-topic").textContent = "Вопрос " + (qIndex + 1) + " из " + QUESTIONS.length + " · " + q.topic;
  $("q-text").textContent = q.text;
  $("qcard").classList.toggle("revealed", isRevealed);

  const picked = store.get("pick:" + q.id, null);
  const opts = $("q-opts");
  opts.innerHTML = "";
  q.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.dataset.picked = picked === i ? "1" : "0";
    b.dataset.correct = q.answer === i ? "1" : "0";
    b.innerHTML = '<span class="letter">' + LETTERS[i] + "</span><span></span>";
    b.lastChild.textContent = text;
    b.addEventListener("click", () => {
      store.set("pick:" + q.id, i);
      renderQuestion();
    });
    opts.appendChild(b);
  });

  const verdict = $("q-verdict");
  if (isRevealed) {
    const ok = picked === q.answer;
    verdict.textContent = picked === null
      ? "Ответ: " + LETTERS[q.answer]
      : (ok ? "✓ Верно: " + LETTERS[q.answer] : "✗ Ваш выбор — " + LETTERS[picked] + ", верный ответ — " + LETTERS[q.answer]);
    verdict.style.color = picked === null ? "" : (ok ? "var(--good)" : "var(--accent)");
  } else {
    verdict.textContent = picked === null ? "" : "Ваш выбор: " + LETTERS[picked];
    verdict.style.color = "";
  }
  $("q-explain").hidden = !isRevealed;
  $("q-explain").textContent = q.explain;
  $("q-reveal").textContent = isRevealed ? "Скрыть ответ" : "Показать ответ";

  renderCounter();
}

function renderCounter() {
  const q = QUESTIONS[qIndex];
  const grid = $("count-grid");
  const cnt = counts(q);
  const total = cnt.reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...cnt);
  grid.innerHTML = "";
  q.options.forEach((_, i) => {
    const ctl = document.createElement("div");
    ctl.className = "count-ctl";
    const minus = document.createElement("button"); minus.textContent = "−";
    minus.setAttribute("aria-label", "Минус один за " + LETTERS[i]);
    const input = document.createElement("input");
    input.type = "number"; input.min = 0; input.max = 999; input.value = cnt[i];
    input.id = "cnt-" + q.id + "-" + i;
    input.setAttribute("aria-label", "Голосов за " + LETTERS[i]);
    const plus = document.createElement("button"); plus.textContent = "+";
    plus.setAttribute("aria-label", "Плюс один за " + LETTERS[i]);
    const save = (v) => { const c = counts(q); c[i] = Math.max(0, v | 0); store.set("cnt:" + q.id, c); renderCounter(); };
    minus.addEventListener("click", () => save(counts(q)[i] - 1));
    plus.addEventListener("click", () => save(counts(q)[i] + 1));
    input.addEventListener("change", () => save(+input.value));
    ctl.append(minus, input, plus);

    const row = document.createElement("div");
    row.className = "bar-row";
    const letter = document.createElement("strong"); letter.textContent = LETTERS[i];
    const track = document.createElement("div"); track.className = "bar-track";
    const fill = document.createElement("div"); fill.className = "bar-fill";
    fill.dataset.correct = q.answer === i ? "1" : "0";
    fill.style.width = (cnt[i] / max * 100) + "%";
    track.appendChild(fill);
    const num = document.createElement("span"); num.className = "bar-num";
    num.textContent = total ? cnt[i] + " · " + Math.round(cnt[i] / total * 100) + "%" : "0";
    row.append(letter, track, num);
    grid.append(ctl, row);
  });
}

$("q-reveal").addEventListener("click", () => {
  const q = QUESTIONS[qIndex];
  revealed[q.id] = !revealed[q.id];
  renderQuestion();
});
$("q-reset").addEventListener("click", () => {
  const q = QUESTIONS[qIndex];
  store.set("pick:" + q.id, null);
  store.set("cnt:" + q.id, [0, 0, 0, 0]);
  revealed[q.id] = false;
  renderQuestion();
});


renderQuestion();
</script>
</body>
</html>
