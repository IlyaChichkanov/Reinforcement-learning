name: Проверка работы

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать работу студента
        uses: actions/checkout@v4

      - name: Забрать инструменты курса
        uses: actions/checkout@v4
        with:
          repository: IlyaChichkanov/Reinforcement-learning
          path: _course

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Код результата квиза
        id: quiz
        run: |
          {
            echo "## Код результата квиза"
            echo '```'
            python _course/tools/check_quiz_code.py quiz/*.txt 2>&1 | tee quiz_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ноутбук с домашним заданием
        if: always()
        run: |
          {
            echo "## Ноутбук"
            echo '```'
            python _course/tools/check_homework.py homework.ipynb 2>&1 | tee nb_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Написать отчёт в pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8').trim(); } catch { return 'проверка не запускалась'; } };
            const body = [
              '### Автопроверка работы',
              '',
              '**Код результата квиза**',
              '```', read('quiz_report.txt'), '```',
              '',
              '**Ноутбук**',
              '```', read('nb_report.txt'), '```',
              '',
              '_Автопроверка смотрит только на полноту сдачи: баллы за квиз и за задания выставляет преподаватель._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const marker = '### Автопроверка работы';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const mine = comments.data.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
