name: Проверка работы

# Проверяет блоки hwN/, которые изменились в этом пуше: ноутбук выполнен целиком,
# заготовок и упавших ячеек нет, коды квизов вставлены и не испорчены.
# Коммиты выдачи задания («Выдан блок N») не проверяются. Запуск вручную проверяет все блоки.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать работу студента
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Забрать инструменты курса
        uses: actions/checkout@v4
        with:
          repository: IlyaChichkanov/Reinforcement-learning
          path: _course

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить сданные блоки
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        # код выхода собираем явно: в оболочке по умолчанию «… | tee» его теряет
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          case "$MESSAGE" in "Выдан блок"*) say "Выдано новое задание — проверять пока нечего."; exit 0;; esac

          if [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            blocks=$(git diff --name-only "$BEFORE" "$SHA" | sed -n 's#^\(hw[0-9][0-9]*\)/.*#\1#p' | sort -u)
          else
            blocks=$(find . -maxdepth 1 -type d -name 'hw[0-9]*' -printf '%f\n' | sort)
          fi
          if [ -z "$blocks" ]; then say "Папки домашек не менялись — проверять нечего."; exit 0; fi

          rc=0
          for b in $blocks; do
            [ -d "$b" ] || continue
            r=0
            {
              echo "### $b: коды квизов"
              python _course/tools/check_quiz_code.py --required "$b"/quiz/*.txt 2>&1 || r=1
              echo
              echo "### $b: ноутбук"
              python _course/tools/check_homework.py "$b/homework.ipynb" 2>&1 || r=1
            } > report.txt
            cat report.txt
            if [ $r -eq 0 ]; then verdict="✅ $b сдано полностью"; else verdict="❌ $b: есть что поправить"; rc=1; fi
            { echo "## $verdict"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "$verdict"
          done
          exit $rc
