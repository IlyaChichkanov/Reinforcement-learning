name: Создать репозитории студентов

# Запуск вручную: Actions → «Создать репозитории студентов» → Run workflow.
# Для каждого логина из students.csv создаёт закрытый <org>/rl-<логин> из шаблона
# <org>/rl-template и приглашает студента. Повторный запуск безопасен: уже созданное
# пропускается, новые логины добавляются. Задания выдаёт отдельная кнопка «Выдать блок».

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать, что будет сделано"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты курса
        uses: actions/checkout@v4
        with:
          repository: IlyaChichkanov/Reinforcement-learning
          path: _course

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить логины
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        # не роняем запуск: ненайденные логины create пропустит и перечислит
        run: |
          python _course/tools/student_repos.py check --students students.csv > check.txt 2>&1 || true
          cat check.txt
          { echo "## Проверка логинов"; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Создать репозитории и пригласить
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          ORG: ${{ github.repository_owner }}
        # код выхода сохраняем явно: в оболочке по умолчанию «… | tee» его теряет
        run: |
          extra=""; [ "$DRY_RUN" = "true" ] && extra="--dry-run"
          if [ -n "$extra" ]; then echo "режим: ПРОБНЫЙ (dry-run) — ничего не создаётся" > report.txt; else echo "режим: настоящий" > report.txt; fi
          rc=0
          python _course/tools/student_repos.py create --students students.csv --org "$ORG" $extra >> report.txt 2>&1 || rc=$?
          cat report.txt
          { echo "## Репозитории"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Сохранить отчёт в reports/
        if: always()
        env:
          NAME: create-repos
          PARAMS: "dry_run=${{ inputs.dry_run }}"
        # отчёт файлом в репозитории: его видно без открытия Actions (и его читает Claude)
        run: |
          mkdir -p reports
          f="reports/$(date -u +%Y-%m-%d_%H%M%S)-$NAME.txt"
          {
            echo "запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "параметры: $PARAMS"
            echo
            for r in check.txt report.txt; do if [ -f "$r" ]; then cat "$r"; echo; fi; done
          } > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$f"
          git commit -q -m "Отчёт: $NAME"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          echo "не удалось сохранить отчёт"; exit 1
