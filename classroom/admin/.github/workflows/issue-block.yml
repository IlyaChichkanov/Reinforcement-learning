name: Выдать блок

# Запуск вручную: Actions → «Выдать блок» → Run workflow → номер блока.
# Кладёт в репозиторий каждого студента папку hwN/: ноутбук из homeworks/hwN/ курса
# и заготовки кодов квизов (недели 2N-1 и 2N). Уже существующие файлы не трогает —
# повторный запуск безопасен и ничего не перезапишет у тех, кто начал работу.

on:
  workflow_dispatch:
    inputs:
      block:
        description: "Номер блока"
        required: true
      dry_run:
        description: "Только показать, что будет сделано"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты и задания курса
        uses: actions/checkout@v4
        with:
          repository: IlyaChichkanov/Reinforcement-learning
          path: _course

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Выдать
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BLOCK: ${{ inputs.block }}
          DRY_RUN: ${{ inputs.dry_run }}
          GROUP: ${{ vars.QUIZ_GROUP || 'RL-2026' }}
          ORG: ${{ github.repository_owner }}
        run: |
          case "$BLOCK" in (*[!0-9]*|'') echo "номер блока — число"; exit 1;; esac
          extra=""; [ "$DRY_RUN" = "true" ] && extra="--dry-run"
          if [ -n "$extra" ]; then echo "режим: ПРОБНЫЙ (dry-run) — ничего не выдаётся" > report.txt; else echo "режим: настоящий" > report.txt; fi
          rc=0
          python _course/tools/student_repos.py issue --students students.csv --org "$ORG" \
            --block "$BLOCK" --source "_course/homeworks/hw$BLOCK" --group "$GROUP" $extra >> report.txt 2>&1 || rc=$?
          cat report.txt
          { echo "## Блок $BLOCK"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Сохранить отчёт в reports/
        if: always()
        env:
          NAME: issue-block
          PARAMS: "block=${{ inputs.block }} dry_run=${{ inputs.dry_run }}"
        # отчёт файлом в репозитории: его видно без открытия Actions (и его читает Claude)
        run: |
          mkdir -p reports
          f="reports/$(date -u +%Y-%m-%d_%H%M%S)-$NAME.txt"
          {
            echo "запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "параметры: $PARAMS"
            echo
            for r in report.txt; do if [ -f "$r" ]; then cat "$r"; echo; fi; done
          } > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$f"
          git commit -q -m "Отчёт: $NAME"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          echo "не удалось сохранить отчёт"; exit 1
