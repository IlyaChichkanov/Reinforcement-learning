name: Кто принял приглашение и сдавал

on:
  workflow_dispatch:
    inputs:
      block:
        description: "Номер блока"
        default: "1"
        required: true

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Инструменты курса
        uses: actions/checkout@v4
        with:
          repository: IlyaChichkanov/Reinforcement-learning
          path: _course
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Статус
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BLOCK: ${{ inputs.block }}
          ORG: ${{ github.repository_owner }}
          PREFIX: ${{ vars.REPO_PREFIX || 'rl' }}
        run: |
          case "$BLOCK" in (*[!0-9]*|'') echo "номер блока — число"; exit 1;; esac
          rc=0
          python _course/tools/student_repos.py status --students students.csv \
            --org "$ORG" --prefix "$PREFIX" --block "$BLOCK" > report.txt 2>&1 || rc=$?
          cat report.txt
          { echo "## Блок $BLOCK"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Сохранить отчёт в reports/
        if: always()
        env:
          NAME: status
          PARAMS: "block=${{ inputs.block }}"
        # отчёт файлом в репозитории: его видно без открытия Actions (и его читает Claude)
        run: |
          mkdir -p reports
          f="reports/$(date -u +%Y-%m-%d_%H%M%S)-$NAME.txt"
          {
            echo "запуск: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "параметры: $PARAMS"
            echo
            for r in report.txt; do if [ -f "$r" ]; then cat "$r"; echo; fi; done
          } > "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$f"
          git commit -q -m "Отчёт: $NAME"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          echo "не удалось сохранить отчёт"; exit 1
